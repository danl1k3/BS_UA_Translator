services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: translator-backend
    ports:
      - "8000:8000"
    environment:
      - REMOTE_INFERENCE_URL=${REMOTE_INFERENCE_URL:-https://your-space.hf.space}
      - REMOTE_API_TOKEN=${REMOTE_API_TOKEN:-}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: translator-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
