services:
  app:
    build: .
    container_name: translator
    ports:
      # Local access only: without a proxy in front, X-Forwarded-For can be spoofed
      - "127.0.0.1:80:8000"
    environment:
      - REMOTE_INFERENCE_URL=${REMOTE_INFERENCE_URL:-https://danlike-nllb-200-600-endpoint.hf.space}
      - REMOTE_API_TOKEN=${REMOTE_API_TOKEN:-}
      - COOKIE_SECRET=${COOKIE_SECRET:-}
    restart: unless-stopped
