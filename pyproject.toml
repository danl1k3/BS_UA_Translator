[project]
name = "bs-ua-translator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["backend/.venv", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"
